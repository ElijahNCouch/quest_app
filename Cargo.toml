[package]
name        = "quest_app"
version     = "0.1.0"
edition     = "2021"
authors     = ["Your Name <you@example.com>"]
description = "A Quest VR app"

[lib]
name       = "quest_app"
crate-type = ["cdylib", "lib"]

[dependencies]
space_soup  = { path = "../space_soup", features = ["canvas"] }
mirror      = { path = "../mirror" }
openxr      = { version = "0.18", features = ["loaded"] }
glam        = "0.29"
log         = "0.4"
env_logger  = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
ndk-glue       = { version = "0.7" }

[profile.release]
opt-level = 3
lto       = true
strip     = true